name: Tracking QA audit
description: Automatically audit a site's web analytics / tracking setup
title: "[Audit] "
labels: ["audit"]
body:
  - type: markdown
    attributes:
      value: |
        When this request is submitted, GitHub Actions scans the site with a real browser and posts the report link as a comment (~2–4 min).
        **Requests are public.** Only submit sites you are allowed to audit.
  - type: input
    id: url
    attributes:
      label: Site URL
      placeholder: https://www.example-store.com
    validations:
      required: true
  - type: input
    id: sector
    attributes:
      label: Business model
      description: ecommerce, leadgen or subscription
      value: ecommerce
  - type: input
    id: currency
    attributes:
      label: Currency
      value: TRY
  - type: input
    id: product_url
    attributes:
      label: Product page URL (optional)
  - type: input
    id: cart_url
    attributes:
      label: Cart URL (optional)
  - type: input
    id: checkout_url
    attributes:
      label: Checkout URL (optional)
